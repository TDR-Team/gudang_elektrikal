name: gudang_elektrikal
version: 1.0.0+2
publish_to: none
description: A new Flutter project.
environment:
  sdk: ^3.9.2

dependencies:
  cupertino_icons: ^1.0.6
  get: ^4.7.3
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  logger: ^2.3.0
  dropdown_search: ^7.0.0
  flutter_screenutil: ^5.9.3
  timeago: ^3.7.0
  flutter_image_compress: ^2.3.0
  image_cropper: ^12.2.0
  image_picker: ^1.1.2
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_auth: ^6.3.0
  cloud_functions: ^6.1.0
  uuid: ^4.4.2
  connectivity_plus: ^7.1.1
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_native_splash: ^2.4.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/img_logoApp.png"
  min_sdk_android: 21
  remove_alpha_ios: true
